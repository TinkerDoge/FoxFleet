# DRAFT release workflow: runs when a tag like v0.1.0-alpha is pushed. Nothing else depends on it.
# It builds the server tarball (+ SHA256SUMS) and, if the signing secrets exist, a release-signed APK, then creates a GitHub Release.
# Repository secrets for APK signing (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   the release .jks, base64-encoded (base64 -w0 foxfleet-release.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# See site/project/development.md ("Signing a release").
name: release
on:
  push:
    tags: ['v*']
permissions: {}   # nothing by default; each job asks for what it needs
# Only people with write access to the repository can push a tag and therefore publish a release.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may create the release
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the release notes for this tag
        id: notes
        run: |
          set -eu
          F="RELEASE_NOTES_${GITHUB_REF_NAME#v}.md"
          if [ ! -f "$F" ]; then echo "::error::$F is missing. Add release notes for $GITHUB_REF_NAME before tagging."; exit 1; fi
          echo "file=$F" >> "$GITHUB_OUTPUT"
          # -alpha / -beta / -rc (any tag containing a hyphen) is a pre-release
          case "$GITHUB_REF_NAME" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT";; *) echo "pre=false" >> "$GITHUB_OUTPUT";; esac
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Test the hub
        run: npm test
      - name: Build the web app
        working-directory: web
        run: npm ci && npm run build
      - name: Package the server
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          D="foxfleet-server-$V"
          mkdir -p "out/$D/docs" out
          cp -r server connector deploy LICENSE README.md NOTICE.md SECURITY.md TERMS.md PRIVACY.md CHANGELOG.md compose.yaml Dockerfile "out/$D/"
          rm -rf "out/$D/server/test"
          mkdir -p "out/$D/web" && cp -r web/dist "out/$D/web/dist"
          cp docs/CONNECT-AGENT.md docs/INSTALL.md "out/$D/docs/"
          tar -C out -czf "out/$D.tar.gz" "$D"
      - uses: actions/setup-java@v4
        if: env.HAS_SIGNING == 'true'
        with: { distribution: temurin, java-version: 17 }
      - name: Build the signed APK
        if: env.HAS_SIGNING == 'true'
        working-directory: android
        env:
          FOXFLEET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FOXFLEET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FOXFLEET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export FOXFLEET_KEYSTORE="$RUNNER_TEMP/release.jks"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36"
          ./gradlew assembleRelease --stacktrace
          mkdir -p ../out && cp app/build/outputs/apk/release/app-release.apk "../out/foxfleet-${GITHUB_REF_NAME#v}.apk"
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Checksums
        working-directory: out
        run: sha256sum *.tar.gz *.apk > SHA256SUMS 2>/dev/null || sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.notes.outputs.pre == 'true' }}
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.file }}
          files: |
            out/*.tar.gz
            out/*.apk
            out/SHA256SUMS
