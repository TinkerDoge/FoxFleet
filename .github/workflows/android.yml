name: android
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  assemble:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # The ubuntu runner image already ships the Android SDK (ANDROID_HOME=/usr/local/lib/android/sdk), so we do NOT
      # use android-actions/setup-android: its sdkmanager call fails on the runner ("Failed to find package 'tools'").
      # compileSdk is 36 (android/app/build.gradle.kts); make sure that platform is present and the licences are
      # accepted so AGP can fetch whatever build-tools it needs. Both commands are no-ops if already satisfied.
      # There is deliberately no local.properties in CI, so Gradle falls back to ANDROID_HOME.
      - name: Ensure Android SDK platform 36 and licences
        run: |
          set -eu
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          echo "using $SDKMANAGER (ANDROID_HOME=$ANDROID_HOME)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true   # `yes` gets SIGPIPE when sdkmanager exits; that is fine
          "$SDKMANAGER" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4   # caches ~/.gradle between runs
      - run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      # The screen-takeover assets (screen.html, screen.js, noVNC) must be inside the built APK.
      - run: node ../scripts/check-android-assets.mjs --apk app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: foxfleet-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
