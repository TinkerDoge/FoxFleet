<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src wss: ws:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:">
<style>
  #screen { touch-action: none; }
  html, body { margin: 0; width: 100%; height: 100%; background: #0b0b0c; overflow: hidden; }
  /* fixed + vw/vh (dvh where supported): a WebView measured before layout still gets a real size for noVNC's scale-to-fit */
  #screen { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; min-width: 1px; min-height: 1px; }
  #kbd { position: absolute; left: -1000px; top: 0; width: 1px; height: 1px; opacity: 0; }
</style>
</head><body>
<div id="screen"></div>
<textarea id="kbd" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
<script type="module" src="screen.js"></script>
</body></html>
